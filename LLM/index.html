<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<!-- CPU 여러 코어를 쓰기 위한 보조 스크립트 (처음 한 번 페이지가 자동으로 다시 열림) -->
<script>window.coi = { coepCredentialless: () => true, quiet: true };</script>
<script src="coi-serviceworker.js"></script>
<title>Persona AI Finder</title>
  <!-- 홈 화면에 추가해 실행하면 주소창 없이 전체 화면으로 열림 -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="../icon.svg" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Persona AI" />
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --navy:#0f172a; --navy-2:#1e3a8a; --blue:#2563eb; --blue-soft:#eff6ff;
  --s900:#0f172a; --s800:#1e293b; --s700:#334155; --s600:#475569; --s500:#5b6b80;
  --s400:#7c8ca1; --s300:#cbd5e1; --s200:#e2e8f0; --s100:#f1f5f9; --s50:#f8fafc;
  --white:#fff; --danger:#b42318; --danger-bg:#fff1f0; --success:#047857; --success-bg:#ecfdf5;
  --warn:#8a4b09; --warn-bg:#fffbeb;
  --frame:430px; --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box} html{background:var(--s50);overscroll-behavior-y:none}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--s50);color:var(--s900);
  font:17px/1.62 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer;background:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:inherit}[hidden]{display:none!important}
.app-frame{position:relative;width:min(100%,var(--frame));min-height:100vh;min-height:100dvh;margin:auto;overflow:hidden;background:var(--white);box-shadow:0 25px 55px #0f172a24}
.screen{min-height:100vh;min-height:100dvh}
.fade-in{animation:fade-in .34s var(--ease) both}
@keyframes fade-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spinner{animation:spin 1s linear infinite!important}}

/* ── 헤더 ── */
.app-header{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:48px 1fr 98px;align-items:center;min-height:86px;padding:max(12px,env(safe-area-inset-top)) 14px 10px;color:#fff;background:#0f172afa;backdrop-filter:blur(16px)}
.header-actions{display:flex;gap:4px;justify-content:flex-end}
.icon-button{display:grid;place-items:center;width:46px;height:46px;padding:0;border-radius:14px;color:var(--s500)}
.header-button{color:#fff;background:#ffffff1a}
.header-button:disabled{opacity:.3}
.icon-button svg{width:23px;height:23px}
.header-title{min-width:0;text-align:center}
.header-title strong{display:block;overflow:hidden;font-size:19px;font-weight:800;text-overflow:ellipsis;white-space:nowrap}
.header-title small{display:block;margin-bottom:2px;color:#9dc7fd;font-size:16px;font-weight:800;letter-spacing:.02em}
.step-area{padding:22px 16px 0;background:#fff}
.step-meta{display:flex;justify-content:space-between;color:var(--blue);font-size:16px;font-weight:850;letter-spacing:.04em}
.step-area h1{margin:9px 0 18px;font-size:31px;font-weight:900;line-height:1.18;letter-spacing:-.035em}
.progress-track{height:5px;overflow:hidden;border-radius:999px;background:var(--s100)}
.progress-track i{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .35s var(--ease)}

/* ── 인트로 ── */
.api-screen{display:flex;flex-direction:column;justify-content:center;padding:46px 32px calc(42px + env(safe-area-inset-bottom));text-align:center;background:#fff}
.hero-icon{display:grid;place-items:center;width:96px;height:96px;margin:0 auto 32px;border-radius:50%;color:#fff;background:var(--blue);box-shadow:0 10px 32px #2563eb61}
.hero-icon svg{width:48px;height:48px;stroke-width:2.2}
.hero-title{margin:0;color:var(--s900);font-size:clamp(42px,12vw,52px);font-weight:900;font-style:italic;line-height:1.08;letter-spacing:-.055em}
.hero-subtitle{margin:22px 0 38px;color:var(--s500);font-size:17px;font-weight:600;line-height:1.75}

/* ── 카드 · 본문 ── */
.content{padding:20px 16px 150px;background:#fff}
.content.no-bottom{padding-bottom:44px}
.card{margin:0 0 18px;padding:21px 19px;border:1px solid var(--s100);border-radius:24px;background:#fff;box-shadow:0 8px 24px #0f172a0d}
.card-dark{color:#fff;background:var(--navy);border-color:var(--navy);box-shadow:0 18px 40px #0f172a33}
.eyebrow{margin-bottom:10px;color:var(--blue);font-size:16px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.card-dark .eyebrow{color:#7db4fb}
.display-title{margin:0 0 13px;font-size:28px;font-weight:900;line-height:1.25;letter-spacing:-.035em}
.body-copy{margin:0;color:var(--s600);font-size:17px;font-weight:520;line-height:1.7}
.card-dark .body-copy{color:#d6dfeb}
.section-heading{margin:28px 0 10px;font-size:23px;font-weight:900;letter-spacing:-.025em}
.sub-heading{display:block;margin:24px 0 11px;color:var(--blue);font-size:19px;font-weight:900;letter-spacing:-.02em}
.helper{margin:12px 2px 0;color:var(--s500);font-size:16px;line-height:1.65}

/* ── 버튼 ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:15px 20px;border-radius:18px;font-size:18px;font-weight:800;line-height:1.3;text-decoration:none;transition:.15s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn svg{width:22px;height:22px}
.btn-full{width:100%}
.btn-primary{color:#fff;background:var(--navy-2);box-shadow:0 8px 22px #1e3a8a2e}
.btn-primary:hover:not(:disabled){background:#1d4ed8}
.btn-dark{color:#fff;background:var(--navy);box-shadow:0 10px 28px #0f172a29}
.btn-outline{color:var(--s900);background:#fff;border:2px solid var(--s200)}
.btn-outline:hover:not(:disabled){border-color:var(--s300);background:var(--s50)}
.btn-small{min-height:50px;padding:11px 15px;border-radius:15px;font-size:17px}
.bottom-bar{position:fixed;z-index:30;bottom:0;left:50%;width:min(100%,var(--frame));padding:14px 16px calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);border-top:1px solid var(--s100);background:#fffffff2;backdrop-filter:blur(16px)}
.bottom-stack{display:grid;gap:9px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}

/* ── 메시지 ── */
.message{margin:0 0 18px;padding:15px 16px;border-radius:15px;text-align:left;font-size:16px;font-weight:620;line-height:1.65}
.message-error{color:var(--danger);background:var(--danger-bg);border:1px solid #ffd5d2}
.message-success{color:var(--success);background:var(--success-bg);border:1px solid #bbf7d0}
.message-info{color:#1a4bc4;background:var(--blue-soft);border:1px solid #dbeafe}
.message-warn{color:var(--warn);background:var(--warn-bg);border:1px solid #fde68a}

/* ── 선택 카드 ── */
.country-list,.size-list{display:grid;gap:12px}
.country-card{display:grid;grid-template-columns:56px 1fr 28px;align-items:center;gap:14px;width:100%;padding:17px 18px;border:2px solid var(--s100);border-radius:22px;text-align:left;background:#fff;transition:.16s}
.country-card:hover{border-color:var(--s300)}
.country-card.selected{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 8px 22px #2563eb1c}
.country-mark{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;width:56px;min-width:56px}
.country-code{display:block;color:var(--s700);font-size:14px;font-weight:900;line-height:1;letter-spacing:.08em;text-align:center}
.country-card.selected .country-code{color:var(--blue)}
.country-flag-emoji{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;overflow:hidden;background:#fff;box-shadow:0 3px 9px #0f172a24,0 0 0 1px #0f172a12;transition:transform .16s var(--ease),box-shadow .16s var(--ease)}
.country-card:hover .country-flag-emoji{transform:translateY(-1px) scale(1.04);box-shadow:0 5px 12px #0f172a2b,0 0 0 1px #0f172a12}
.country-card.selected .country-flag-emoji{box-shadow:0 5px 14px #2563eb33,0 0 0 2px #2563eb22}
.country-flag-svg{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden}
.country-card h3{margin:0 0 4px;font-size:21px;font-weight:900;letter-spacing:-.02em}
.country-card p{margin:0;color:var(--s500);font-size:16px;font-weight:600;word-break:break-all}
.check-dot{display:grid;place-items:center;width:28px;height:28px;border:2px solid var(--s300);border-radius:50%;color:#fff}
.selected .check-dot{border-color:var(--blue);background:var(--blue)}
.check-dot svg{width:16px;height:16px;stroke-width:3.2}
.size-card{display:grid;grid-template-columns:1fr 28px;align-items:center;gap:14px;width:100%;padding:17px 18px;border:2px solid var(--s100);border-radius:22px;text-align:left;background:#fff;transition:.16s}
.size-card:hover{border-color:var(--s300)}
.size-card.selected{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 8px 22px #2563eb1c}
.size-card b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em}
.size-card em{display:block;margin-top:6px;color:var(--s600);font-size:17px;font-weight:700;font-style:normal;line-height:1.5}
.size-card.selected em{color:#1a4bc4}
.size-card .warn-tag{display:inline-block;margin-top:8px;padding:4px 11px;border-radius:999px;color:var(--warn);background:var(--warn-bg);font-size:16px;font-weight:800}

/* ── 요약 숫자 ── */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.fact{min-width:0;padding:13px 8px;border-radius:15px;text-align:center;background:var(--blue-soft)}
.fact small{display:block;color:var(--s600);font-size:16px;font-weight:750}
.fact strong{display:block;margin-top:5px;overflow:hidden;color:var(--navy);font-size:18px;font-weight:900;letter-spacing:-.03em;text-overflow:ellipsis;white-space:nowrap}
.card-dark .fact small{color:var(--s600)}
.card-dark .fact strong{color:var(--navy)}

/* ── 조건 행 ── */
.filter-list{display:grid;gap:10px}
.filter-row{display:grid;grid-template-columns:1fr auto 22px;align-items:center;gap:10px;width:100%;padding:17px 17px;border:1.5px solid var(--s200);border-radius:20px;background:#fff;text-align:left;transition:.15s}
.filter-row:hover{border-color:var(--s300);background:var(--s50)}
.filter-row.active{border-color:var(--blue);background:var(--blue-soft)}
.fr-label{min-width:0;font-size:18px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr-value{max-width:150px;overflow:hidden;color:var(--s500);font-size:17px;font-weight:700;text-align:right;text-overflow:ellipsis;white-space:nowrap}
.filter-row.active .fr-value{color:var(--blue)}
.filter-row svg{width:20px;height:20px;color:var(--s400)}
details.more{margin-top:12px}
details.more summary{cursor:pointer;padding:13px 4px;color:var(--blue);font-size:17px;font-weight:800;list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary:before{content:"＋ "}
details.more[open] summary:before{content:"－ "}

/* ── 칩 · 스위치 ── */
.chip-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.chip-btn{padding:12px 17px;border:1.5px solid var(--s200);border-radius:999px;color:var(--s700);background:#fff;font-size:17px;font-weight:800;transition:.15s}
.chip-btn.on{color:#fff;background:var(--blue);border-color:var(--blue);box-shadow:0 6px 16px #2563eb33}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:18px;padding:15px 16px;border-radius:18px;background:var(--s50)}
.switch-row span{font-size:17px;font-weight:750}
.switch-row em{display:block;margin-top:4px;color:var(--s500);font-size:16px;font-weight:600;font-style:normal;line-height:1.55}
.switch{position:relative;flex:0 0 56px;width:56px;height:33px;border-radius:999px;background:var(--s300);transition:.18s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px #0f172a2e;transition:.18s var(--ease)}
.switch.on{background:var(--blue)}
.switch.on:after{transform:translateX(23px)}

/* ── 입력 ── */
.text-input,.text-area{width:100%;padding:15px 16px;border:1.5px solid var(--s200);border-radius:18px;color:var(--s900);background:var(--s50);font-size:17px;font-weight:560;outline:0;transition:.18s}
.text-area{min-height:106px;resize:vertical;line-height:1.65}
.text-input:focus,.text-area:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px #2563eb1c}
.text-input::placeholder,.text-area::placeholder{color:var(--s400)}
.example-box{margin-top:13px;padding:16px;border:1px solid #dbeafe;border-radius:18px;background:var(--blue-soft)}
.example-box b{display:block;margin-bottom:11px;color:var(--blue);font-size:16px;font-weight:900;letter-spacing:.06em}
.example-box p{margin:12px 0 0;color:var(--s600);font-size:16px;line-height:1.6}
.example-chips{display:flex;flex-wrap:wrap;gap:7px}
.example-chip{padding:9px 14px;border:1px solid #c7ddfc;border-radius:999px;color:#1a4bc4;background:#fff;font-size:17px;font-weight:750;transition:.14s}
.example-chip:hover{background:#dbeafe;border-color:var(--blue)}
.example-chip:active{transform:scale(.96)}
.range-row{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:10px;margin-top:16px}
.range-row span{text-align:center;color:var(--s500);font-size:18px;font-weight:800}
.match-line{margin:16px 0 0;padding:15px 16px;border-radius:16px;background:var(--blue-soft);border:1px solid #dbeafe;color:var(--s700);font-size:17px;font-weight:750;text-align:center;line-height:1.6}
.match-line b{color:#1a4bc4;font-size:19px;font-weight:900}

/* ── 로딩 ── */
.loading-card{padding:34px 20px;text-align:center}
.spinner{display:block;width:62px;height:62px;margin:0 auto 26px;border:6px solid var(--s100);border-top-color:var(--blue);border-right-color:#60a5fa;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.work-progress{position:relative;height:8px;margin:24px 0 12px;overflow:hidden;border-radius:999px;background:var(--s100)}
.work-progress i{display:block;height:100%;border-radius:inherit;background:var(--blue);transition:width .35s var(--ease)}
.work-progress:after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,#ffffffb8,transparent);animation:sweep 1.4s infinite}
@keyframes sweep{to{transform:translateX(100%)}}
.progress-caption{display:flex;justify-content:space-between;color:var(--s600);font-size:16px;font-weight:750}

/* ── 페르소나 카드 ── */
.persona-list{display:grid;gap:12px;max-width:100%}
.persona-card{width:100%;max-width:100%;padding:19px;border:1.5px solid var(--s100);border-radius:22px;text-align:left;background:#fff;transition:.15s;overflow:hidden;overflow-wrap:anywhere;word-break:break-word}
.persona-card:hover{border-color:var(--s300);background:var(--s50)}
.persona-card h3{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 4px;font-size:22px;font-weight:900;line-height:1.3;letter-spacing:-.025em}
.persona-card h3 span{min-width:0;flex:1 1 auto;overflow-wrap:anywhere;word-break:break-word}
.persona-card h3 i{flex:0 0 auto;color:var(--s300);margin-top:3px}
.persona-card h3 svg{width:20px;height:20px}
.persona-role{margin:0 0 11px;color:var(--blue);font-size:17px;font-weight:800;line-height:1.45}
.persona-meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.status-chip{display:inline-flex;align-items:center;max-width:100%;min-height:30px;padding:4px 11px;border-radius:999px;color:#1a4bc4;background:#dbeafe;font-size:16px;font-weight:800;overflow-wrap:anywhere;word-break:break-word}
.persona-summary{margin:0;color:var(--s600);font-size:17px;font-weight:520;line-height:1.7;overflow-wrap:anywhere;word-break:break-word}
.list-more{margin-top:14px}

/* ── 바텀시트 ── */
.modal-backdrop{position:fixed;z-index:100;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-top:40px;background:#0f172a9e}
.modal-sheet{display:flex;flex-direction:column;width:min(100%,var(--frame));max-height:88vh;padding:0 16px calc(20px + env(safe-area-inset-bottom));border-radius:30px 30px 0 0;background:#fff;animation:sheet-up .3s var(--ease) both}
@keyframes sheet-up{from{transform:translateY(30px);opacity:.65}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0 14px;border-bottom:1px solid var(--s100)}
.modal-head h2{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em}
.modal-head .icon-button{background:var(--s100);color:var(--s700)}
.modal-body{flex:1;overflow:auto;padding:14px 0}
.modal-foot{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding-top:12px;border-top:1px solid var(--s100)}
.opt-line{display:flex;align-items:center;gap:12px;width:100%;padding:14px 12px;border-radius:15px;text-align:left;font-size:18px;font-weight:650;transition:.12s}
.opt-line:hover{background:var(--s50)}
.opt-line.on{background:var(--blue-soft);color:#1a4bc4;font-weight:800}
.opt-text{min-width:0;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt-count{flex:0 0 auto;color:var(--s500);font-size:16px;font-weight:800}
.opt-line.on .opt-count{color:#1a4bc4}
.opt-mark{display:grid;place-items:center;flex:0 0 28px;width:28px;height:28px;border:2px solid var(--s300);border-radius:50%;background:#fff;color:#fff}
.opt-line.on .opt-mark{border-color:var(--blue);background:var(--blue)}
.opt-mark svg{width:16px;height:16px;stroke-width:3.4}
.raw-field{margin-top:10px;padding:14px 15px;border-radius:15px;background:var(--s50)}
.raw-field b{display:block;margin-bottom:5px;color:var(--blue);font-size:16px;font-weight:900;letter-spacing:.02em}
.raw-field span{display:block;color:var(--s700);font-size:17px;line-height:1.7;word-break:break-word;white-space:pre-line}

.toast{position:fixed;z-index:200;top:calc(18px + env(safe-area-inset-top));left:50%;width:min(calc(100% - 32px),398px);padding:15px 17px;transform:translateX(-50%);border-radius:15px;color:#fff;background:var(--s900);box-shadow:0 15px 35px #0f172a40;font-size:17px;font-weight:750;text-align:center;animation:toast-in .25s var(--ease) both}
@keyframes toast-in{from{opacity:0;transform:translate(-50%,-10px)}}
.foot-note{margin:28px 2px 0;color:var(--s500);font-size:16px;line-height:1.75;text-align:center}
.foot-note a{color:var(--blue);font-weight:700}
@media(max-width:380px){
  .content,.step-area,.bottom-bar{padding-left:13px;padding-right:13px}
  .card{padding:18px 15px}.hero-title{font-size:40px}
  .fact small{font-size:16px}.fact strong{font-size:17px}
}

/* ── AI 전용 ── */
.ai-status{display:inline-flex;align-items:center;gap:7px;margin-top:14px;padding:7px 13px;border-radius:999px;background:#ffffff1a;color:#d6dfeb;font-size:16px;font-weight:800}
.ai-status.ok{background:#10b98126;color:#a7f3d0}
.ai-status svg{width:18px;height:18px}
.lang-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.lang-pill{padding:5px 11px;border-radius:999px;background:var(--s100);color:var(--s600);font-size:16px;font-weight:800}
.hint-box{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.hint-box:empty{display:none}
.hint-label{color:var(--s500);font-size:16px;font-weight:800}

.cluster-rep{margin:6px 0 0;color:var(--s500);font-size:16px;font-weight:650;line-height:1.6}

  for (const [col, min, max] of rngs) {
    const n = Number(cellText(row[col]));
    if (!Number.isFinite(n) || n < min || n > max) return false;
  }
  return true;
}
function baseRows(hints) {
  const { cats, rngs } = conditionMatchers();
  const plans = hintPlans(hints).filter(p => p.ok);
  return state.rows.filter(row => {
    if ((cats.length || rngs.length) && !matchesConditions(row, cats, rngs)) return false;
    for (const p of plans) {
      const h = p.h;
      if (h.id === 'age') {
        const a = rowAge(row);
        if (a == null || (h.min != null && a < h.min) || (h.max != null && a > h.max)) return false;
      } else if (h.id === 'sex') {
        if (rowSex(row) !== h.sex) return false;
      } else if (!p.set.has(cellText(row[p.col]))) return false;
    }
    return true;
  });
}

// ---- 페르소나 이름 / 표시 --------------------------------------------
function pickField(row, candidates) {
  for (const c of candidates) { const v = cellText(row[c]).trim(); if (v) return v; }
  return '';
}
function latinName(text) {
  const words = text.split(' ');
  const out = [];
  for (let i = 0; i < Math.min(words.length, 5); i++) {
    const w = words[i].replace(/[,;:.!?]+$/, '');
    if (!w) break;
    if (/^[A-ZÀ-ÞŁØ]/.test(w)) { out.push(w); continue; }
    if (out.length && NAME_PARTICLES.has(w.toLowerCase()) && /^[A-ZÀ-ÞŁØ]/.test(words[i + 1] || '')) { out.push(w); continue; }
    break;
  }
  return out.length >= 2 ? out.join(' ') : '';
}
function personaName(row) {
  const cached = nameCache.get(row);
  if (cached !== undefined) return cached;
  const raw = pickField(row, ['persona', 'professional_persona', 'family_persona', 'cultural_background']);
  let name = '';
  if (raw) {
    const head = raw.replace(/\s+/g, ' ').trim().slice(0, 120);
    if (HANGUL_RE.test(head.slice(0, 22))) {
      const m = head.match(/^([가-힣]{2,5})\s*(?:씨|님)?\s*(?:은|는|이|가|의)(?=[\s,.、]|$)/)
        || head.match(/^([가-힣]{2,5})\s*(?:씨|님)(?=[\s,.、]|$)/)
        || head.match(/^([가-힣]{2,5})(?=[,、])/);
      if (m) name = m[1].replace(/([가-힣]{2,})[씨님]$/, '$1');
    }
    if (!name && CJK_RE.test(head.slice(0, 20))) {
      const m = head.match(/^([^\s、。,.]{1,12}(?:\s[^\s、。,.]{1,12})?)\s*(?:は|さんは|が)/);
      if (m) name = m[1].trim();
    }
    if (!name) name = latinName(head);
  }
  nameCache.set(row, name);
  return name;
}
function personaTitle(row) {
  return personaName(row) || prettyText(pickField(row, ['occupation', 'job', 'employment_status', 'industry'])) || '이름 없음';
}
function personaRole(row) {
  const job = prettyText(pickField(row, ['occupation', 'job', 'employment_status', 'industry']));
  return personaName(row) ? job : '';
}
function personaChips(row) {
  const chips = [];
  const sex = pickField(row, ['sex', 'gender']);
  if (sex) chips.push(prettyText(displayValue('sex', sex)));
  const age = pickField(row, ['age', 'age_group']);
  if (age) chips.push(/^\d+$/.test(age) ? `${age}세` : prettyText(age));
  const place = pickField(row, PLACE_FIELDS);
  if (place) chips.push(prettyText(place));
  const edu = pickField(row, ['education_level', 'education']);
  if (edu) chips.push(prettyText(displayValue('education_level', edu)));
  return chips.slice(0, 4);
}
function personaSummary(row) {
  const raw = pickField(row, ['persona', 'professional_persona', 'cultural_background', 'career_goals_and_ambitions', 'skills_and_expertise']);
  const text = raw.replace(/\s+/g, ' ').trim();
  return text.length > 170 ? text.slice(0, 170) + '…' : text;
}
function rowColumns(sample) {
  const keys = Object.keys(sample || {}).filter(k => !INTERNAL_COL_RE.test(k));
  const first = PREFERRED_ORDER.filter(c => keys.includes(c));
  return [...first, ...keys.filter(c => !first.includes(c))];
}

function passageText(row) {
  const cached = passageCache.get(row);
  if (cached !== undefined) return cached;
  const head = [
    pickField(row, ['sex', 'gender']),
    row.age != null && row.age !== '' ? `${cellText(row.age)}` : '',
    pickField(row, ['occupation', 'job']),
    pickField(row, PLACE_FIELDS),
    pickField(row, ['education_level', 'education']),
    pickField(row, ['marital_status']),
  ].filter(Boolean).map(prettyText).join(' · ');
  const parts = [head];
  for (const f of PASSAGE_FIELDS) {
    const v = cellText(row[f]).replace(/\s+/g, ' ').trim();
    if (v) parts.push(v);
  }
  const text = parts.filter(Boolean).join('\n').slice(0, PASSAGE_CHARS);
  passageCache.set(row, text);
  return text;
}
function vecKey(row) {
  const cached = vecKeyCache.get(row);
  if (cached) return cached;
  const id = row?.uuid || row?.id || row?.person_id || fnv(passageText(row));
  const key = `${VEC_VERSION}|${state.country?.dataset}|${state.split}|${id}`;
  vecKeyCache.set(row, key);
  return key;
}

function workerCode() {
  return [
    "import { AutoTokenizer, AutoModel, mean_pooling, env } from '" + TJS_URL + "';",
    "env.allowLocalModels = false;",
    "let tok = null, model = null, info = null;",
    "const hc = (self.navigator && self.navigator.hardwareConcurrency) || 4;",
    "const threads = self.crossOriginIsolated ? Math.max(1, Math.min(4, hc)) : 1;",
    "try { env.backends.onnx.wasm.numThreads = threads; } catch (_) {}",
    "const pick = p => ({ status: p.status, file: p.file || '', loaded: p.loaded || 0, total: p.total || 0 });",
    "async function embed(texts, maxLen) {",
    "  const inputs = tok(texts, { padding: true, truncation: true, max_length: maxLen });",
    "  const out = await model(inputs);",
    "  let h = out.last_hidden_state;",
    "  if (h.type !== 'float32') h = h.to('float32');",
    "  const pooled = mean_pooling(h, inputs.attention_mask).normalize(2, -1);",
    "  return { dim: pooled.dims[pooled.dims.length - 1], data: new Float32Array(pooled.data) };",
    "}",
    "async function tryGpu(name, cb) {",
    "  if (!self.navigator || !self.navigator.gpu) return false;",
    "  try {",
    "    const adapter = await self.navigator.gpu.requestAdapter();",
    "    if (!adapter || !adapter.features.has('shader-f16')) return false;",
    "    model = await AutoModel.from_pretrained(name, { dtype: 'fp16', device: 'webgpu', progress_callback: cb });",
    "    const t = await embed(['passage: 새로운 기술을 좋아하는 사람', 'passage: a person who loves cooking'], 32);",
    "    let s = 0; for (const v of t.data) { if (!Number.isFinite(v)) throw new Error('bad'); s += Math.abs(v); }",
    "    if (s < 1e-3) throw new Error('bad');",
    "    info = { device: 'webgpu', dtype: 'fp16', threads: 0 };",
    "    return true;",
    "  } catch (e) {",
    "    try { if (model && model.dispose) await model.dispose(); } catch (_) {}",
    "    model = null;",
    "    return false;",
    "  }",
    "}",
    "self.onmessage = async (e) => {",
    "  const m = e.data || {};",
    "  try {",
    "    if (m.type === 'load') {",
    "      const cb = p => { try { self.postMessage({ type: 'progress', info: pick(p) }); } catch (_) {} };",
    "      if (!tok) tok = await AutoTokenizer.from_pretrained(m.model, { progress_callback: cb });",
    "      if (!model && m.preferGpu) { self.postMessage({ type: 'stage', stage: 'gpu' }); await tryGpu(m.model, cb); }",
    "      if (!model) {",
    "        self.postMessage({ type: 'stage', stage: 'cpu' });",
    "        model = await AutoModel.from_pretrained(m.model, { dtype: m.dtype, device: 'wasm', progress_callback: cb });",
    "        info = { device: 'wasm', dtype: m.dtype, threads };",
    "      }",
    "      self.postMessage({ type: 'ready', id: m.id, info });",
    "    } else if (m.type === 'embed') {",
    "      const r = await embed(m.texts, m.maxLen);",
    "      self.postMessage({ type: 'embedded', id: m.id, dim: r.dim, data: r.data }, [r.data.buffer]);",
    "    }",
    "  } catch (err) {",
    "    self.postMessage({ type: 'error', id: m.id, message: String((err && err.message) || err) });",
    "  }",
    "};",
  ].join('\n');
}

const engine = { worker: null, ready: false, loadPromise: null, seq: 0, waits: new Map(), files: new Map(), info: null, stage: '' };
function engineLabel() {
  const i = engine.info;
  if (!i) return '';
  return i.device === 'webgpu' ? 'GPU 사용 중' : `CPU ${i.threads || 1}코어 사용 중`;
}
const embedBatch = () => (engine.info?.device === 'webgpu' ? EMBED_BATCH_GPU : EMBED_BATCH_CPU);
function failEngine(err) {
  engine.waits.forEach(w => w.reject(err));
  engine.waits.clear();
  try { engine.worker?.terminate(); } catch { /* noop */ }
  engine.worker = null; engine.ready = false; engine.loadPromise = null;
}
function getWorker() {
  if (engine.worker) return engine.worker;
  if (typeof Worker === 'undefined') throw new Error('이 브라우저는 AI 실행을 지원하지 않습니다. 최신 Chrome이나 삼성 인터넷으로 열어 주세요.');
  const url = URL.createObjectURL(new Blob([workerCode()], { type: 'text/javascript' }));
  const w = new Worker(url, { type: 'module' });
  w.onmessage = e => {
    const m = e.data || {};
    if (m.type === 'progress') { trackDownload(m.info || {}); return; }
    if (m.type === 'stage') { engine.stage = m.stage; paintAi(); return; }
    const wait = engine.waits.get(m.id);
    if (!wait) return;
    engine.waits.delete(m.id);
    if (m.type === 'error') wait.reject(new Error(m.message || 'AI 오류'));
    else wait.resolve(m);
  };
  w.onerror = e => {
    try { e.preventDefault(); } catch { /* noop */ }
    failEngine(new Error('AI 엔진을 시작하지 못했습니다. 인터넷 연결을 확인하거나 최신 Chrome · 삼성 인터넷으로 열어 주세요.'));
  };
  engine.worker = w;
  return w;
}
function callEngine(msg, transfer = []) {
  const id = ++engine.seq;
  return new Promise((resolve, reject) => {
    engine.waits.set(id, { resolve, reject });
    try { getWorker().postMessage({ ...msg, id }, transfer); }
    catch (e) { engine.waits.delete(id); reject(e); }
  });
}
function trackDownload(info) {
  if (!info.file) return;
  const cur = engine.files.get(info.file) || { loaded: 0, total: 0 };
  if (info.total) cur.total = info.total;
  if (info.loaded) cur.loaded = info.loaded;
  if (info.status === 'done' && cur.total) cur.loaded = cur.total;
  engine.files.set(info.file, cur);
  let loaded = 0, total = 0;
  engine.files.forEach(f => { loaded += f.loaded; total += f.total; });
  state.ai.dlLoaded = loaded; state.ai.dlTotal = total;
  paintAi();
}
function untilCancelled(promise) {
  return new Promise((resolve, reject) => {
    const signal = state.controller?.signal;
    if (signal?.aborted) return reject(new Error('CANCELLED'));
    const onAbort = () => reject(new Error('CANCELLED'));
    signal?.addEventListener('abort', onAbort, { once: true });
    promise.then(v => { signal?.removeEventListener('abort', onAbort); resolve(v); },
      e => { signal?.removeEventListener('abort', onAbort); reject(e); });
  });
}
async function ensureModel() {
  if (engine.ready) return;
  state.ai.phase = 'model';
  paintAi();
  if (!engine.loadPromise) {
    engine.files.clear();
    engine.loadPromise = callEngine({ type: 'load', model: MODEL_ID, dtype: MODEL_DTYPE, preferGpu: true })
      .then(res => { engine.ready = true; engine.info = res.info || null; state.modelCached = true; })
      .catch(e => { engine.loadPromise = null; throw e; });
  }
  try {
    await untilCancelled(engine.loadPromise);
  } catch (e) {
    // 내려받는 도중 중지하면 데이터 낭비를 막기 위해 엔진을 닫는다
    if (String(e.message) === 'CANCELLED' && !engine.ready) failEngine(new Error('CANCELLED'));
    throw e;
  }
}
async function embedTexts(texts) {
  const res = await callEngine({ type: 'embed', texts, maxLen: MAX_TOKENS });
  const dim = res.dim, data = res.data, out = [];
  for (let i = 0; i < texts.length; i++) out.push(data.slice(i * dim, (i + 1) * dim));
  return out;
}
async function checkModelCache() {
  if (engine.ready) { state.modelCached = true; return; }
  try {
    if (!('caches' in window)) return;
    const cache = await caches.open('transformers-cache');
    const keys = await cache.keys();
    const has = keys.some(r => r.url.includes('multilingual-e5-small') && /\.onnx/.test(r.url));
    if (has !== state.modelCached) { state.modelCached = has; if (state.screen === 'result') render(); }
  } catch { /* 확인 불가 */ }
}

// ---- 불러온 수집 파일 보관 (목록이 새로고침 뒤에도 남도록) ------------------
const IMPORT_DB = 'persona-ai-imports';
let impDbPromise = null;
function impDb() {
  if (impDbPromise) return impDbPromise;
  impDbPromise = new Promise(resolve => {
    try {
      if (typeof indexedDB === 'undefined') return resolve(null);
      const req = indexedDB.open(IMPORT_DB, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
        if (!db.objectStoreNames.contains('rows')) db.createObjectStore('rows');
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    } catch { resolve(null); }
  });
  return impDbPromise;
}
async function impGet(store, key) {
  const db = await impDb();
  if (!db) return null;
  return new Promise(resolve => {
    try {
      const q = db.transaction(store, 'readonly').objectStore(store).get(key);
      q.onsuccess = () => resolve(q.result ?? null);
      q.onerror = () => resolve(null);
    } catch { resolve(null); }
  });
}
async function impAllMeta() {
  const db = await impDb();
  if (!db) return [];
  return new Promise(resolve => {
    try {
      const q = db.transaction('meta', 'readonly').objectStore('meta').getAll();
      q.onsuccess = () => resolve(q.result || []);
      q.onerror = () => resolve([]);
    } catch { resolve([]); }
  });
}
async function impWrite(ops) {
  const db = await impDb();
  if (!db) return false;
  return new Promise(resolve => {
    try {
      const tx = db.transaction(['meta', 'rows'], 'readwrite');
      for (const [store, key, value] of ops) {
        if (value === undefined) tx.objectStore(store).delete(key);
        else tx.objectStore(store).put(value, key);
      }
      tx.oncomplete = () => resolve(true);
      tx.onerror = tx.onabort = () => resolve(false);
    } catch { resolve(false); }
  });
}
const importRowsMem = new Map();   // 저장소를 못 쓸 때를 대비한 메모리 보관
async function refreshImports() {
  const list = await impAllMeta();
  const mem = [...importRowsMem.keys()].map(id => state.imports?.find(m => m.id === id)).filter(Boolean);
  const byId = new Map([...mem, ...list].map(m => [m.id, m]));
  state.imports = [...byId.values()].sort((a, b) => String(b.loadedAt).localeCompare(String(a.loadedAt)));
  if (state.screen === 'country') render();
}
function readFileAs(file, kind) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error('read'));
    if (kind === 'buffer') r.readAsArrayBuffer(file); else r.readAsText(file, 'utf-8');
  });
}
async function parseCollectionFile(file) {
  const isExcel = /\.xlsx?$/i.test(file.name || '') || /spreadsheet|excel/i.test(file.type || '');
  const data = isExcel
    ? readExcelProject(new Uint8Array(await readFileAs(file, 'buffer')))
    : JSON.parse(String(await readFileAs(file, 'text') || '{}'));
  const country = COUNTRIES.find(c => c.id === data.country) || COUNTRIES.find(c => c.dataset === data.dataset);
  if (!country) throw new Error('어느 나라 데이터인지 알 수 없습니다.');
  if (!Array.isArray(data.rows) || !data.rows.length) throw new Error('사람 데이터가 없습니다.');
  return { data: { ...data, country: country.id, dataset: country.dataset }, country };
}
// 다운로드 폴더에서 파일 고르기 (지원하는 브라우저는 다운로드 폴더에서 바로 열림)
async function pickCollectionFiles() {
  if (typeof window.showOpenFilePicker === 'function') {
    try {
      const handles = await window.showOpenFilePicker({
        multiple: true, startIn: 'downloads', id: 'persona-collections',
        types: [{ description: '수집 데이터 (작업 파일 · 엑셀)', accept: {
          'application/json': ['.json'],
          'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'],
          'application/vnd.ms-excel': ['.xls'],
        } }],
      });
      importCollectionFiles(await Promise.all(handles.map(h => h.getFile())));
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;   // 사용자가 닫음
    }
  }
  $('#importInput')?.click();
}
async function importCollectionFiles(files) {
  files = [...(files || [])];
  if (!files.length || state.importing) return;
  state.importing = true;
  if (state.screen === 'country') render();
  const added = [], failed = [];
  for (const file of files) {
    try {
      const { data, country } = await parseCollectionFile(file);
      const rows = data.rows;
      const id = `${data.dataset}|${data.split || 'train'}|${file.name}|${rows.length}`;
      const meta = {
        id, fileName: file.name || '이름 없는 파일', country: country.id, dataset: country.dataset,
        config: data.config || 'default', split: data.split || 'train',
        splits: Array.isArray(data.splits) ? data.splits : null,
        total: data.total ?? null, avgRowBytes: data.avgRowBytes ?? null, nextOffset: data.nextOffset ?? null,
        allColumns: data.allColumns || null, query: data.query || '', count: rows.length,
        loadedAt: new Date().toISOString(),
      };
      const saved = await impWrite([['rows', id, rows], ['meta', id, meta]]);
      if (!saved) importRowsMem.set(id, rows);
      state.imports = [meta, ...(state.imports || []).filter(m => m.id !== id)];
      added.push(`${country.name} ${formatN(rows.length)}명`);
    } catch (e) {
      failed.push(file.name || '파일');
    }
  }
  state.importing = false;
  try { navigator.storage?.persist?.(); } catch { /* noop */ }
  state.error = failed.length ? `읽지 못한 파일: ${failed.join(', ')} — 이 프로그램이나 키워드 버전에서 저장한 작업 파일(.json) · 엑셀(.xlsx)인지 확인해 주세요.` : '';
  state.notice = added.length ? `불러왔습니다 — ${added.join(' · ')}. 목록에서 분석할 데이터를 고르세요.` : '';
  state.noticeType = 'success';
  await refreshImports();
  render();
}
async function openImport(id) {
  if (state.busy) return;
  const meta = (state.imports || []).find(m => m.id === id);
  const rows = importRowsMem.get(id) || await impGet('rows', id);
  if (!meta || !Array.isArray(rows) || !rows.length) { toast('이 데이터를 읽지 못했습니다. 파일을 다시 불러와 주세요.'); return; }
  try {
    const country = applyLoaded({ ...meta, rows, splits: meta.splits || undefined });
    state.notice = `${meta.fileName} — ${country.name} ${formatN(rows.length)}명을 불러왔습니다. 이제 찾고 싶은 사람을 문장으로 설명해 보세요.`;
    state.noticeType = 'success';
    state.screen = 'result';
    render();
    checkModelCache();
  } catch { toast('이 데이터를 열 수 없습니다.'); }
}
async function removeImport(id) {
  importRowsMem.delete(id);
  await impWrite([['rows', id, undefined], ['meta', id, undefined]]);
  state.imports = (state.imports || []).filter(m => m.id !== id);
  render();
}

let idbPromise = null;
function idb() {
  if (idbPromise) return idbPromise;
  idbPromise = new Promise(resolve => {
    try {
      if (typeof indexedDB === 'undefined') return resolve(null);
      const req = indexedDB.open('persona-ai-finder', 1);
      req.onupgradeneeded = () => { try { req.result.createObjectStore('vec'); } catch { /* noop */ } };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    } catch { resolve(null); }
  });
  return idbPromise;
}
async function idbGetMany(keys) {
  const out = new Map();
  if (!keys.length) return out;
  const db = await idb();
  if (!db) return out;
  return new Promise(resolve => {
    try {
      const tx = db.transaction('vec', 'readonly');
      const store = tx.objectStore('vec');
      for (const k of keys) {
        const q = store.get(k);
        q.onsuccess = () => { const v = q.result; if (v && v.length) out.set(k, v instanceof Float32Array ? v : new Float32Array(v)); };
      }
      tx.oncomplete = () => resolve(out);
      tx.onerror = tx.onabort = () => resolve(out);
    } catch { resolve(out); }
  });
}
async function idbPutMany(entries) {
  if (!entries.length) return;
  const db = await idb();
  if (!db) return;
  await new Promise(resolve => {
    try {

function kmeans(vecs, k, seed = 7, maxIter = 30) {

  const best = new Float32Array(n).fill(-2);
  while (cents.length < k) {
    const c = cents[cents.length - 1];
    let total = 0;
    const d = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const s = dot(vecs[i], c);
      if (s > best[i]) best[i] = s;
      d[i] = Math.max(0, 1 - best[i]) ** 2;

    if (total <= 0) idx = Math.floor(rand() * n);

  for (let it = 0; it < maxIter; it++) {
    let changed = 0; score = 0;

      let bi = 0, bs = -2;

}
function bestKmeans(vecs, k) {

function silhouette(sim, assign, k) {
  const n = assign.length;

  for (let i = 0; i < n; i++) {
    const sums = new Float64Array(k), cnt = new Int32Array(k);
    for (let j = 0; j < n; j++) { if (i === j) continue; sums[assign[j]] += 1 - sim[i * n + j]; cnt[assign[j]]++; }
    const own = assign[i];
    if (cnt[own] === 0) continue;
    const a = sums[own] / cnt[own];
    let b = Infinity;
    for (let c = 0; c < k; c++) if (c !== own && cnt[c]) b = Math.min(b, sums[c] / cnt[c]);

function chooseK(vecs) {

  const kMax = Math.min(8, Math.floor(n / 5));

  if (kMax < kMin) return Math.max(1, kMax);

  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }

  const sim = new Float32Array(m * m);
  for (let i = 0; i < m; i++) for (let j = i; j < m; j++) { const s = dot(sample[i], sample[j]); sim[i * m + j] = s; sim[j * m + i] = s; }

// 군집 설명 단어 (언어별 단어 나누기)
const segmenters = {};

    segmenters[lang] = seg;

    const out = [];
    for (const s of seg.segment(text)) if (s.isWordLike) out.push(s.segment);

  }

}
function rowTokens(row) {
  const cached = tokenCache.get(row);

  const text = PASSAGE_FIELDS.map(f => cellText(row[f])).join(' ').normalize('NFKC').toLowerCase();
  const set = new Set();
  for (let w of wordsOf(text, lang)) {
    w = w.replace(/^[^\p{L}\p{N}]+|[^\p{L}\p{N}]+$/gu, '');
    if (!w || /\d/.test(w)) continue;
    if (lang === 'ko' && HANGUL_RE.test(w)) { const s = w.replace(KO_SUFFIX_RE, ''); if (s.length >= 2) w = s; }

    if (w.length < 2 || (/^[a-zà-ÿ]+$/.test(w) && w.length < 4)) continue;
    if (STOPWORDS.has(w)) continue;

function clusterTerms(members, allRows) {
  const N = allRows.length;
  if (members.length === N) return [];
  const df = new Map();
  for (const r of allRows) for (const t of rowTokens(r)) df.set(t, (df.get(t) || 0) + 1);
  const dfc = new Map();
  for (const r of members) for (const t of rowTokens(r)) dfc.set(t, (dfc.get(t) || 0) + 1);
  const nc = members.length, nr = Math.max(1, N - nc);

  const scored = [];
  for (const [t, c] of dfc) {

    const all = df.get(t) || c;
    if (all / N > 0.45) continue;   // 거의 모든 사람에게 나오는 단어는 제외
    const pc = c / nc, pr = (all - c + 1) / (nr + 2);

    scored.push([t, pc * Math.log(pc / pr)]);
  }
  scored.sort((a, b) => b[1] - a[1]);
  const out = [];
  for (const [t] of scored) {
    if (out.some(o => o.includes(t) || t.includes(o))) continue;
    out.push(t);

  if (f + m) parts.push(f >= m ? `여성 ${Math.round(f / (f + m) * 100)}%` : `남성 ${Math.round(m / (f + m) * 100)}%`);
  const ages = rows.map(rowAge).filter(a => a != null).sort((a, b) => a - b);
  if (ages.length) parts.push(`평균 ${Math.round(ages.reduce((s, a) => s + a, 0) / ages.length)}세`);
  const place = topValue(rows, PLACE_FIELDS);
  if (place && place.share >= 0.15) parts.push(`${prettyText(place.value)} ${Math.round(place.share * 100)}%`);

  if (job && job.share >= 0.1) parts.push(`${prettyText(job.value)} ${Math.round(job.share * 100)}%`);

// 2차원 지도 (주성분 분석)
function pca2(vecs) {
  const n = vecs.length, dim = vecs[0].length;
  const mean = new Float64Array(dim);
  for (const v of vecs) for (let j = 0; j < dim; j++) mean[j] += v[j];
  for (let j = 0; j < dim; j++) mean[j] /= n;
  const comps = [];
  const rand = mulberry32(3);
  for (let c = 0; c < 2; c++) {
    let w = new Float64Array(dim);
    for (let j = 0; j < dim; j++) w[j] = rand() - 0.5;
    for (let it = 0; it < 40; it++) {
      const next = new Float64Array(dim);
      for (const v of vecs) {
        let p = 0;
        for (let j = 0; j < dim; j++) p += (v[j] - mean[j]) * w[j];
        for (let j = 0; j < dim; j++) next[j] += p * (v[j] - mean[j]);
      }
      for (const prev of comps) {
        let p = 0; for (let j = 0; j < dim; j++) p += next[j] * prev[j];
        for (let j = 0; j < dim; j++) next[j] -= p * prev[j];
      }
      let s = 0; for (let j = 0; j < dim; j++) s += next[j] * next[j];
      s = Math.sqrt(s) || 1;
      for (let j = 0; j < dim; j++) next[j] /= s;
      w = next;
    }
    comps.push(w);
  }
  return vecs.map(v => {
    let x = 0, y = 0;
    for (let j = 0; j < dim; j++) { const d = v[j] - mean[j]; x += d * comps[0][j]; y += d * comps[1][j]; }
    return [x, y];
  });
}

function pickTop(scored) {
  if (state.pick !== 'auto') return scored.slice(0, Number(state.pick));
  const n = scored.length;
  if (!n) return [];
  const mean = scored.reduce((s, x) => s + x.score, 0) / n;
  const sd = Math.sqrt(scored.reduce((s, x) => s + (x.score - mean) ** 2, 0) / n) || 1e-6;
  const cut = mean + sd;
  let k = scored.filter(x => x.score >= cut).length;
  k = Math.max(Math.min(AUTO_MIN, n), Math.min(AUTO_MAX, k));
  return scored.slice(0, k);
}
async function clusterPicked() {
  const picked = state.picked || [];
  state.clusters = []; state.activeCluster = null; state.scatter = null;

  const vecs = picked.map(p => vecStore.get(vecKey(p.row)));
  state.ai.phase = 'cluster'; paintAi(); await tick();
  let k = state.kChoice === 'auto' ? chooseK(vecs) : Math.min(Number(state.kChoice), picked.length);
  k = Math.max(1, k);

  const pts = pca2(sampleIdx.map(i => vecs[i]));
  state.scatter = sampleIdx.map((i, j) => ({ x: pts[j][0], y: pts[j][1], c: picked[i].cluster, i }));

async function runAnalysis(mode = 'search') {
  if (state.busy || !state.rows.length) return;
  const query = state.query.trim();
  if (mode === 'search' && !query) { toast('찾고 싶은 사람을 문장으로 적어 주세요.'); $('#queryInput')?.focus(); return; }
  if (mode === 'recluster' && !state.picked) return;
  const hints = mode === 'all' ? [] : activeHints(parseHints(query));
  state.cancelRequested = false;
  state.controller = new AbortController();
  state.busy = true;
  state.error = ''; state.notice = '';
  state.ai.phase = ''; state.ai.done = 0; state.ai.todo = 0;
  state.screen = 'analyzing';
  render();
  keepAwake(true);
  try {
    if (mode !== 'recluster') {
      await ensureEmbeddings();
      const base = baseRows(hints);
      if (!base.length) throw new Error('NO_BASE');
      const usable = hintPlans(hints).filter(p => p.ok).map(p => p.h);
      const rest = mode === 'search' ? queryRemainder(query, usable) : '';
      state.conditionOnly = mode === 'search' && !rest;
      if (mode === 'search' && state.conditionOnly) {
        // 문장이 조건만으로 되어 있으면 AI 순위 없이 조건에 맞는 사람을 모두 고른다
        const all = base.map(row => ({ row, score: null, rel: null }));
        state.picked = state.pick === 'auto' ? all : all.slice(0, Number(state.pick));
        state.lastQuery = query;
      } else if (mode === 'search') {
        await ensureModel();
        state.ai.phase = 'match'; paintAi();
        const [qv] = await untilCancelled(embedTexts(['query: ' + rest]));
        const scored = base.map(row => ({ row, score: dot(qv, vecStore.get(vecKey(row))) })).sort((a, b) => b.score - a.score);
        const hi = scored[0].score, lo = scored[scored.length - 1].score, span = Math.max(1e-6, hi - lo);
        scored.forEach(s => { s.rel = Math.round((s.score - lo) / span * 100); });
        state.picked = pickTop(scored);
        state.lastQuery = query;
      } else {
        state.picked = base.map(row => ({ row, score: null, rel: null }));
        state.lastQuery = '';
      }
      state.lastHints = usable;
    }
    checkCancelled();
    await clusterPicked();
    state.previewLimit = PREVIEW_STEP;
    const n = state.picked.length, k = state.clusters.length;
    state.notice = mode === 'search' && state.conditionOnly
      ? `모은 ${formatN(state.rows.length)}명 중 문장의 조건(${state.lastHints.map(h => h.label).join(', ')})에 정확히 맞는 ${formatN(n)}명을 골라 ${k}개 군집으로 나눴습니다.`
      : mode === 'search'
      ? `모은 ${formatN(state.rows.length)}명 중 문장과 가장 가까운 ${formatN(n)}명을 골라 ${k}개 군집으로 나눴습니다.`
      : `${formatN(n)}명을 ${k}개 군집으로 나눴습니다.`;
    state.noticeType = 'success';
  } catch (e) {
    const msg = String(e?.message || e);
    if (msg === 'CANCELLED') { state.notice = 'AI 분석을 중지했습니다. 이미 분석한 사람은 저장되어 다음에 이어서 진행됩니다.'; state.noticeType = 'info'; }
    else if (msg === 'NO_BASE') { state.notice = '문장 속 조건(나이 · 성별 · 학력 · 혼자 사는지 · 혼인)이나 프로필 조건에 모두 맞는 사람이 없습니다. 조건을 끄거나 더 모아 보세요.'; state.noticeType = 'warn'; }
    else state.error = `AI 분석 중 문제가 생겼습니다. ${msg}`;
  } finally {
    state.busy = false;
    state.controller = null;
    state.cancelRequested = false;
    keepAwake(false);
  }
  state.screen = 'result';
  render();
  if (state.picked && mode !== 'recluster') requestAnimationFrame(() => $('#resultTop')?.scrollIntoView({ block: 'start' }));
}

// 엑셀(이 프로그램이나 키워드 버전에서 저장한 파일)을 원래 열 이름으로 되돌려 읽는다
const LABEL_TO_COL = (() => {
  const m = new Map();
  for (const [col, label] of Object.entries(LABELS)) if (!m.has(label)) m.set(label, col);
  return m;
})();
const EXCEL_SKIP = new Set(['이름', '관련도', '군집', '군집 특징']);
function readExcelProject(buffer) {
  if (typeof XLSX === 'undefined') throw new Error('엑셀 라이브러리를 불러오지 못했습니다.');
  const wb = XLSX.read(buffer, { type: 'array' });
  const metaWs = wb.Sheets.meta;
  const meta = {};
  if (metaWs) for (const [k, v] of XLSX.utils.sheet_to_json(metaWs, { header: 1, defval: '' })) meta[String(k).trim()] = String(v).trim();
  const country = COUNTRIES.find(c => c.dataset === meta['데이터셋']) || COUNTRIES.find(c => c.name === meta['국가']);
  if (!country) throw new Error('country');
  const [config, split] = (meta['config / split'] || 'default / train').split('/').map(x => x.trim());
  const ws = wb.Sheets.personas || wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  const header = (aoa[0] || []).map(h => String(h).trim());
  const cols = header.map(h => (EXCEL_SKIP.has(h) ? null : LABEL_TO_COL.get(h) || h.toLowerCase().replace(/\s+/g, '_')));
  const rows = [];
  for (const line of aoa.slice(1)) {
    const row = {};
    let filled = false;
    cols.forEach((c, i) => { if (c && line[i] !== '' && line[i] != null) { row[c] = line[i]; filled = true; } });
    if (filled) rows.push(row);
  }
  return { country: country.id, dataset: country.dataset, config: config || 'default', split: split || 'train', rows, allColumns: orderColumns(cols.filter(Boolean)) };
}

const STEP_NO = { country: 1, size: 2, collecting: 3, result: 4, analyzing: 4 };
const FLOW = ['intro', 'country', 'size', 'result'];

function screenAvailable(screen) {
  if (screen === 'intro' || screen === 'country') return true;
  if (screen === 'size') return !!state.country;
  if (screen === 'result') return state.rows.length > 0;
  return false;
}
function prevScreen() {
  const i = FLOW.indexOf(state.screen);
  if (i <= 0) return null;
  for (let k = i - 1; k >= 0; k--) if (screenAvailable(FLOW[k])) return FLOW[k];
  return null;
}
function nextScreen() {
  const i = FLOW.indexOf(state.screen);
  if (i < 0) return null;
  for (let k = i + 1; k < FLOW.length; k++) if (screenAvailable(FLOW[k])) return FLOW[k];
  return null;
}

// ---- 화면: AI 분석 진행 -----------------------------------------------
const PHASES = [
  ['model', 'AI 모델 준비'],
  ['embed', '페르소나 읽기'],
  ['match', '문장과 비교하기'],
  ['cluster', '비슷한 사람끼리 묶기'],
];
function aiText() {
  const a = state.ai;
  if (state.cancelRequested) return { title: '중지하는 중', sub: '지금 처리 중인 묶음이 끝나면 멈춥니다.', pct: null };
  if (a.phase === 'cache') return { title: '저장해 둔 분석을 불러오는 중', sub: '이미 읽은 사람은 다시 읽지 않습니다.', pct: null };
  if (a.phase === 'model') {
    const pct = a.dlTotal ? a.dlLoaded / a.dlTotal * 100 : null;
    const gpu = engine.stage === 'gpu';
    const size = a.dlTotal ? `${formatBytes(a.dlLoaded)} / ${formatBytes(a.dlTotal)}` : `약 ${gpu ? GPU_MODEL_MB : MODEL_MB}MB`;
    const where = gpu ? 'GPU로 실행할 수 있는지 확인하고 있습니다. ' : engine.stage === 'cpu' ? 'CPU로 실행합니다. ' : '';
    return {
      title: state.modelCached ? 'AI 모델을 여는 중' : 'AI 모델을 내려받는 중',
      sub: state.modelCached ? `${where}저장해 둔 모델을 불러오고 있습니다.` : `${where}처음 1회만 받습니다 · ${size}. 다음부터는 바로 시작됩니다.`,
      pct,
    };
  }
  if (a.phase === 'embed') {
    const pct = a.todo ? a.done / a.todo * 100 : 0;
    const elapsed = (performance.now() - a.startAt) / 1000;
    const rate = a.done && elapsed > 0 ? a.done / elapsed : 0;
    const left = rate ? (a.todo - a.done) / rate : 0;
    return {
      title: 'AI가 페르소나를 읽는 중',
      sub: `${formatN(a.done)} / ${formatN(a.todo)}명${rate ? ` · 초당 ${rate.toFixed(1)}명 · 남은 시간 ${formatDuration(left)}` : ''}${engineLabel() ? ` · ${engineLabel()}` : ''}`,
      pct,
    };
  }
  if (a.phase === 'match') return { title: '문장과 비교하는 중', sub: '의미가 가까운 사람부터 순서를 매깁니다.', pct: null };
  if (a.phase === 'cluster') return { title: '비슷한 사람끼리 묶는 중', sub: '군집 수를 정하고 특징 단어를 찾습니다.', pct: null };
  return { title: 'AI를 준비하는 중', sub: '', pct: null };
}
function phaseHtml() {
  const order = PHASES.map(p => p[0]);
  const cur = state.ai.phase === 'cache' ? 'embed' : state.ai.phase;
  const ci = order.indexOf(cur);
  return PHASES.map(([id, label], i) => {
    const cls = i < ci ? 'done' : i === ci ? 'now' : '';
    const icon = i < ci ? 'circle-check' : i === ci ? 'loader' : 'circle';
    return `<div class="phase ${cls}"><i data-lucide="${icon}"></i>${esc(label)}</div>`;
  }).join('');
}
function paintAi() {
  if (state.screen !== 'analyzing') return;
  const t = aiText();
  const title = $('#aiTitle'), sub = $('#aiSub'), bar = $('#aiBar'), wrap = $('#aiBarWrap'), phases = $('#aiPhases');
  if (title) title.textContent = t.title;
  if (sub) sub.textContent = t.sub;
  if (wrap) wrap.hidden = t.pct == null;
  if (bar && t.pct != null) bar.style.width = `${Math.min(100, t.pct)}%`;
  if (phases) {
    const key = state.ai.phase;
    if (phases.dataset.phase !== key) { phases.dataset.phase = key; phases.innerHTML = phaseHtml(); renderIcons(); }
  }
}
function renderAnalyzing(app) {
  const t = aiText();
  const content = `<section class="card loading-card">

function filterRowHtml(field) {
  const summary = conditionSummary(field);
  const active = summary !== '상관 없음';
  return `<button class="filter-row ${active ? 'active' : ''}" data-field="${esc(field.col)}">
    <span class="fr-label">${esc(fieldLabel(field.col))}</span>
    <span class="fr-value">${esc(summary)}</span>
    <i data-lucide="chevron-right"></i>
  </button>`;
}
function hintsHtml() {
  const hints = parseHints(state.query);
  if (!hints.length) return '';
  const plans = state.rows.length ? hintPlans(hints) : hints.map(h => ({ h, ok: true, values: [] }));
  const chips = plans.map(({ h, ok }) => {
    const off = state.hintsOff.has(h.id);
    if (!ok) return `<span class="hint-chip soft" title="데이터에 해당 항목이 없어 AI가 의미로 판단합니다">${esc(h.label)} · AI 판단</span>`;
    return `<button class="hint-chip ${off ? 'off' : ''}" data-hint="${h.id}" aria-pressed="${!off}">${esc(h.label)} <i data-lucide="${off ? 'plus' : 'x'}"></i></button>`;
  }).join('');
  const details = plans.filter(p => p.ok && p.values && p.values.length && !state.hintsOff.has(p.h.id)).map(p => {
    const shown = p.values.slice(0, 4).map(v => prettyText(displayValue(p.col, v)));
    return `<div class="hint-detail"><b>${esc(fieldLabel(p.col))}</b> ${esc(shown.join(' · '))}${p.values.length > 4 ? ` 외 ${p.values.length - 4}` : ''}</div>`;
  }).join('');
  const empty = plans.filter(p => p.ok && p.values && !p.values.length && !['age', 'sex'].includes(p.h.id) && !state.hintsOff.has(p.h.id))
    .map(p => `<div class="hint-detail warn">${esc(p.h.label)}에 해당하는 값이 모은 데이터에 없습니다</div>`).join('');
  return `<span class="hint-label">문장에서 찾은 조건</span>${chips}${details || empty ? `<div class="hint-details">${details}${empty}</div>` : ''}`;
}
function bindHints() {
  document.querySelectorAll('[data-hint]').forEach(b => {
    b.onclick = () => {
      const id = b.dataset.hint;
      if (state.hintsOff.has(id)) state.hintsOff.delete(id); else state.hintsOff.add(id);
      paintHints();
    };
  });
}
function paintHints() {
  const box = $('#hintBox');
  if (!box) return;
  box.innerHTML = hintsHtml();
  bindHints();
  renderIcons();
}
function personaCard(p, i) {

  drawScatter();
}

// ---- 군집 지도 -----------------------------------------------------------
function drawScatter() {
  const canvas = $('#scatter');
  if (!canvas || !state.scatter) return;
  const pts = state.scatter;
  const draw = () => {
    const w = canvas.clientWidth || 380, h = canvas.clientHeight || 280;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    const ctx = canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of pts) { if (p.x < minX) minX = p.x; if (p.x > maxX) maxX = p.x; if (p.y < minY) minY = p.y; if (p.y > maxY) maxY = p.y; }
    const pad = 16, sx = (w - pad * 2) / Math.max(1e-6, maxX - minX), sy = (h - pad * 2) / Math.max(1e-6, maxY - minY);
    const r = pts.length > 1200 ? 2.4 : pts.length > 300 ? 3.4 : 4.6;
    canvas._map = [];
    for (const dim of [true, false]) {
      for (const p of pts) {
        const active = state.activeCluster == null || p.c === state.activeCluster;
        if (dim === active) continue;
        const x = pad + (p.x - minX) * sx, y = pad + (p.y - minY) * sy;
        ctx.globalAlpha = active ? 0.85 : 0.12;
        ctx.fillStyle = CLUSTER_COLORS[p.c % CLUSTER_COLORS.length];
        ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        if (active) canvas._map.push([x, y, p.i]);
      }
    }
    ctx.globalAlpha = 1;
  };
  draw();
  canvas.onclick = e => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    let best = null, bd = 18 * 18;
    for (const [px, py, i] of canvas._map || []) { const d = (px - x) ** 2 + (py - y) ** 2; if (d < bd) { bd = d; best = i; } }
    if (best != null) openRowSheet(state.picked[best]?.row);
  };
}
window.addEventListener('resize', () => { if (state.screen === 'result') drawScatter(); });

// ---- 바텀시트 ---------------------------------------------------------
function closeSheet() {
  const modal = $('#modal');
  modal.hidden = true;
  modal.innerHTML = '';
}
function openFieldSheet(field) {
  if (!field) return;
  if (field.control === 'range') return openRangeSheet(field);
  const selected = new Set(state.category[field.col] || []);
  const modal = $('#modal');
  modal.hidden = false;
  const listHtml = options => options.map(opt => `
    <button class="opt-line ${selected.has(opt) ? 'on' : ''}" data-opt="${esc(opt)}" role="checkbox" aria-checked="${selected.has(opt)}">
      <span class="opt-text">${esc(prettyText(displayValue(field.col, opt)))}</span>
      <span class="opt-count">${formatN(field.counts.get(opt) || 0)}</span>
      <span class="opt-mark"><i data-lucide="check"></i></span>
    </button>`).join('');
  modal.innerHTML = `<div class="modal-backdrop" id="sheetBackdrop"><div class="modal-sheet" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>${esc(fieldLabel(field.col))}</h2>
      <button class="icon-button" id="sheetClose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    ${field.options.length > 12 ? '<input class="text-input" id="sheetSearch" placeholder="검색" style="margin-top:12px">' : ''}
    <div class="modal-body" id="sheetList">${listHtml(field.options)}</div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-small" id="sheetClear">상관 없음</button>
      <button class="btn btn-primary btn-small" id="sheetApply">적용</button>
    </div>
  </div></div>`;
  const list = $('#sheetList');
  const bind = () => list.querySelectorAll('[data-opt]').forEach(btn => {
    btn.onclick = () => {
      const value = btn.dataset.opt;
      if (selected.has(value)) { selected.delete(value); btn.classList.remove('on'); }
      else { selected.add(value); btn.classList.add('on'); }
      btn.setAttribute('aria-checked', String(selected.has(value)));
    };
  });
  bind();
  const search = $('#sheetSearch');
  if (search) {
    search.oninput = () => {
      const q = normText(search.value);
      const filtered = q ? field.options.filter(o => normText(displayValue(field.col, o)).includes(q) || normText(o).includes(q)) : field.options;
      list.innerHTML = filtered.length ? listHtml(filtered) : '<p class="body-copy" style="padding:20px 4px">검색 결과가 없습니다.</p>';
      bind();
      renderIcons();
    };
  }
  $('#sheetClose').onclick = closeSheet;
  $('#sheetBackdrop').onclick = e => { if (e.target.id === 'sheetBackdrop') closeSheet(); };
  $('#sheetClear').onclick = () => { delete state.category[field.col]; closeSheet(); conditionsChanged(); };
  $('#sheetApply').onclick = () => {
    if (selected.size) state.category[field.col] = [...selected];
    else delete state.category[field.col];
    closeSheet();
    conditionsChanged();
  };
  renderIcons();
}
function conditionsChanged() {
  if (state.picked) {
    state.notice = '프로필 조건이 바뀌었습니다. 다시 골라내려면 ‘AI로 골라내기’를 눌러 주세요.';
    state.noticeType = 'info';
  }
  render();
}
function readNumber(id, fallback) {
  const el = $('#' + id);
  const raw = el ? String(el.value ?? '').trim() : '';
  if (!raw) return fallback;
  const n = Number(raw.replace(/[^\d.\-]/g, ''));
  return Number.isFinite(n) ? n : fallback;
}
function openRangeSheet(field) {
  const b = field.bounds;
  const cur = state.ranges[field.col] || { any: true, min: b.min, max: b.max };
  const modal = $('#modal');
  modal.hidden = false;
  modal.innerHTML = `<div class="modal-backdrop" id="sheetBackdrop"><div class="modal-sheet" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>${esc(fieldLabel(field.col))}</h2>
      <button class="icon-button" id="sheetClose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <p class="body-copy">모은 데이터에서는 <b>${esc(formatN(b.min))} ~ ${esc(formatN(b.max))}</b> 사이입니다. 한쪽만 채워도 됩니다.</p>
      <div class="range-row">
        <input class="text-input" id="rangeMin" type="text" inputmode="numeric" autocomplete="off" value="${esc(cur.min ?? b.min)}" aria-label="최소값">
        <span>~</span>
        <input class="text-input" id="rangeMax" type="text" inputmode="numeric" autocomplete="off" value="${esc(cur.max ?? b.max)}" aria-label="최대값">
      </div>
      <p class="helper">비워 두면 그쪽 끝값이 자동으로 들어갑니다.</p>
    </div>
    <div class="modal-foot">
      <button class="btn btn-outline btn-small" id="sheetClear">상관 없음</button>
      <button class="btn btn-primary btn-small" id="sheetApply">적용</button>
    </div>
  </div></div>`;
  $('#sheetClose').onclick = closeSheet;
  $('#sheetBackdrop').onclick = e => { if (e.target.id === 'sheetBackdrop') closeSheet(); };
  $('#sheetClear').onclick = () => { delete state.ranges[field.col]; closeSheet(); conditionsChanged(); };
  $('#sheetApply').onclick = () => {
    let min = readNumber('rangeMin', b.min);
    let max = readNumber('rangeMax', b.max);
    if (min > max) { const t = min; min = max; max = t; }
    min = Math.min(Math.max(min, b.min), b.max);
    max = Math.min(Math.max(max, b.min), b.max);
    if (min <= b.min && max >= b.max) delete state.ranges[field.col];
    else state.ranges[field.col] = { any: false, min, max };
    closeSheet();
    conditionsChanged();
  };
  renderIcons();
}
function openRowSheet(row) {
  if (!row) return;
  const cols = rowColumns(row);
  const body = cols.map(c => {
    const v = cellText(row[c]).trim();
    if (!v) return '';
    return `<div class="raw-field"><b>${esc(fieldLabel(c))}</b><span>${esc(v)}</span></div>`;
  }).join('');
  const role = personaRole(row);
  const modal = $('#modal');
  modal.hidden = false;
  modal.innerHTML = `<div class="modal-backdrop" id="sheetBackdrop"><div class="modal-sheet" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2>${esc(personaTitle(row))}</h2>
      <button class="icon-button" id="sheetClose" aria-label="닫기"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      ${role ? `<p class="persona-role" style="margin-bottom:12px">${esc(role)}</p>` : ''}
      ${body || '<p class="body-copy">표시할 내용이 없습니다.</p>'}
    </div>
  </div></div>`;
  $('#sheetClose').onclick = closeSheet;
  $('#sheetBackdrop').onclick = e => { if (e.target.id === 'sheetBackdrop') closeSheet(); };
  renderIcons();
}

// ---- 라우팅 · 화면 상태 유지 -------------------------------------------
function goBack() {
  if (state.busy) return;
  const target = prevScreen();
  if (!target) return;
  closeSheet();
  state.screen = target;
  state.error = '';
  render();
}
function goForward() {
  if (state.busy) return;
  const target = nextScreen();
  if (!target) return;
  closeSheet();
  state.screen = target;
  state.error = '';
  render();
}
function goHome() {
  if (state.busy) return;
  if (state.rows.length && !confirm('처음으로 돌아가면 모은 데이터가 사라집니다. 계속할까요?')) return;
  closeSheet();
  state.country = null;
  resetForCountry();
  state.splits = [];
  state.screen = 'intro';
  render();
}

let lastScreen = null;
const scrollMemory = Object.create(null);
function currentScrollY() {
  return window.scrollY || window.pageYOffset || document.documentElement.scrollTop || 0;
}
function captureView() {
  const active = document.activeElement;
  const editable = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
  return {
    scrollY: currentScrollY(),
    focusId: editable && active.id ? active.id : null,
    selStart: editable ? active.selectionStart : null,
    selEnd: editable ? active.selectionEnd : null,
  };
}
function restoreView(view) {
  try { window.scrollTo(0, view.scrollY); } catch { /* noop */ }
  if (!view.focusId) return;
  const el = $('#' + view.focusId);
  if (!el) return;
  try {
    el.focus({ preventScroll: true });
    if (view.selStart != null && typeof el.setSelectionRange === 'function') {
      el.setSelectionRange(view.selStart, view.selEnd);
    }
  } catch { /* noop */ }
}
function render() {
  const app = $('#app');
  const screen = state.screen;
  const sameScreen = lastScreen === screen;
  const view = sameScreen ? captureView() : null;
  if (!sameScreen && lastScreen) scrollMemory[lastScreen] = currentScrollY();

  if (screen === 'intro') renderIntro(app);
  else if (screen === 'country') renderCountry(app);
  else if (screen === 'meta') renderMeta(app);
  else if (screen === 'size') renderSize(app);
  else if (screen === 'collecting') renderCollecting(app);
  else if (screen === 'analyzing') renderAnalyzing(app);
  else if (screen === 'result') renderResult(app);

  const back = $('#backButton'), fwd = $('#forwardButton'), home = $('#homeButton');
  if (back) back.onclick = goBack;
  if (fwd) fwd.onclick = goForward;
  if (home) home.onclick = goHome;

  lastScreen = screen;
  if (view) restoreView(view);
  else { try { window.scrollTo(0, scrollMemory[screen] || 0); } catch { /* noop */ } }
  renderIcons();
}

window.addEventListener('beforeunload', e => {
  if (state.rows.length) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

/* 당겨서 새로고침 막기 */
(function blockPullToRefresh() {
  let startY = 0;
  document.addEventListener('touchstart', e => {
    if (e.touches.length === 1) startY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    const dy = e.touches[0].clientY - startY;
    if (dy <= 0) return;
    for (let el = e.target; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      if (el.scrollTop > 0) {
        const oy = getComputedStyle(el).overflowY;
        if (oy === 'auto' || oy === 'scroll') return;
      }
    }
    const pageTop = (document.scrollingElement || document.documentElement).scrollTop <= 0;
    if (pageTop && e.cancelable) e.preventDefault();
  }, { passive: false });
})();

// 테스트용 진입점 (화면에는 영향 없음)
window.__personaAI = { state, importCollectionFiles, eduLevelOfValue, maritalOfValue, queryRemainder, hintPlans, parseHints, kmeans, chooseK, rowTokens, clusterTerms, passageText, workerCode };

render();
})();
